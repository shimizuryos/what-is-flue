# テスト・ビルドと、Cloudflare Workers への公開版のデプロイ。
# - PR と push のたびに: 型チェック → 全レッスンをモックLLMで実行（結果を公開版の再生用に記録）→ UI のビルド
# - main への push のときだけ: ビルド結果を Cloudflare Workers にデプロイする
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  WRANGLER_SEND_METRICS: false

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # 全レッスンのサンプルメッセージを本物の Flue ランタイム + モックLLM で実行して検証し、
      # そのイベントを公開版の UI が再生する記録として web/public/recordings/ に保存する
      - name: Run all lessons and record them
        run: npm test -- --record web/public/recordings
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare Workers
    # main への push（と手動実行）のときだけデプロイする。PR ではデプロイしない
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Secret がまだ無い段階では、失敗させずに警告だけ出して飛ばす
      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のため、デプロイをスキップしました"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # workers.dev のサブドメインが無ければ登録する（登録済みなら何もしない）。
      # wrangler は CI のような対話できない環境ではサブドメインを登録できないため、API で行う
      - name: Ensure workers.dev subdomain
        if: steps.check.outputs.skip != 'true'
        env:
          WORKERS_SUBDOMAIN: shimizuryos  # 未登録のときに使う名前
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          current=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq -r '.result.subdomain // empty')
          if [ -n "$current" ]; then
            echo "workers.dev サブドメイン: $current.workers.dev (登録済み)"
            exit 0
          fi
          res=$(curl -sS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data "{\"subdomain\":\"$WORKERS_SUBDOMAIN\"}" "$api")
          if [ "$(echo "$res" | jq -r '.success')" != "true" ]; then
            echo "::error::workers.dev サブドメイン \"$WORKERS_SUBDOMAIN\" を登録できませんでした: $(echo "$res" | jq -c '.errors')"
            exit 1
          fi
          echo "workers.dev サブドメインを登録しました: $WORKERS_SUBDOMAIN.workers.dev"

      - uses: actions/checkout@v7
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-node@v7
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.skip != 'true'
      - uses: actions/download-artifact@v8
        if: steps.check.outputs.skip != 'true'
        with:
          name: site
          path: dist  # wrangler.jsonc の assets.directory

      - name: Deploy
        id: deploy
        if: steps.check.outputs.skip != 'true'
        run: |
          # パイプ (| tee) の途中で wrangler が失敗したら、このステップも失敗にする
          set -o pipefail
          npx wrangler deploy | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1 || true)
          if [ -z "$url" ]; then
            echo "::error::公開 URL (workers.dev) が見つかりません。デプロイのログを確認してください"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
